<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Estamos fazendo melhorias. Voltaremos em breve!">
  <title>Em manutenção</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --card: rgba(24, 37, 58, .82);
      --text: #f5f7fb;
      --muted: #b7c2d4;
      --accent: #6ee7b7;
      --accent-2: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(96,165,250,.20), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(110,231,183,.16), transparent 30%),
        var(--bg);
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 104px;
      height: 104px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      color: #0b1726;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transform: rotate(-5deg);
    }
    .icon svg { width: 54px; height: 54px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.04;
      letter-spacing: -.055em;
    }
    .description {
      max-width: 470px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 11px 16px;
      border: 1px solid rgba(110,231,183,.28);
      border-radius: 999px;
      color: #d1fae5;
      background: rgba(110,231,183,.08);
      font-size: .9rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(110,231,183,.12);
      animation: pulse 1.8s infinite;
    }
    footer {
      margin-top: 38px;
      color: #8190a7;
      font-size: .82rem;
    }
    @keyframes pulse {
      50% { box-shadow: 0 0 0 9px rgba(110,231,183,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a4.5 4.5 0 0 0-5.9 5.9L3 18l3 3 5.8-5.8a4.5 4.5 0 0 0 5.9-5.9l-3 3-3-3 3-3Z"/>
        <path d="m15 5 4-2 2 2-2 4"/>
      </svg>
    </div>
    <p class="eyebrow">Voltamos em breve</p>
    <h1>Estamos em manutenção.</h1>
    <p class="description">
      Estamos trabalhando para deixar tudo ainda melhor para você.
      Nosso site estará de volta em breve. Obrigado pela paciência!
    </p>
    <div class="status"><span class="dot"></span> Melhorias em andamento</div>
    <footer>© <span id="year"></span> — Obrigado pela visita.</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
